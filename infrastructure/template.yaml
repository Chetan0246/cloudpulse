AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CloudPulse — Autonomous Cloud Reliability and Self-Healing Simulator
  Course: BCSE355L – Cloud Architecture Design | Fall 2026-2027

  Foundation Serverless Architecture:
  - API Gateway HTTP API + FastAPI Lambda (Mangum)
  - DynamoDB (PAY_PER_REQUEST, Standard table class)
  - S3 (Private by default, optional public website toggle)
  - CloudWatch (7-day log retention, custom metrics, threshold alarms)
  - EventBridge (Scheduled heartbeat + Alarm state change routing)
  - SNS (Notification topic + optional email subscription)
  - SQS (Recovery DLQ)
  - IAM (Least-privilege role per Lambda function)

# ──────────────────────────────────────────────────────────────────────────────
# Global Configuration
# ──────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
    Architectures:
      - arm64
    Layers:
      - !Ref CloudPulseLayer
    Environment:
      Variables:
        DYNAMODB_RESOURCES_TABLE: !Ref ResourcesTable
        DYNAMODB_INCIDENTS_TABLE: !Ref IncidentsTable
        CLOUDWATCH_NAMESPACE: !Ref CloudWatchNamespace
        EVENTBRIDGE_BUS_NAME: default
        SNS_TOPIC_ARN: !Ref NotificationsTopic
        AWS_REGION_NAME: !Ref AWS::Region
        LOG_LEVEL: !Ref LogLevel
    Tags:
      Project: CloudPulse
      Course: BCSE355L
      Environment: !Ref Environment

# ──────────────────────────────────────────────────────────────────────────────
# Parameters
# ──────────────────────────────────────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment target environment.

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address for SNS failure/recovery notifications. Leave blank to skip.

  CorsAllowedOrigins:
    Type: String
    Default: "*"
    Description: CORS allowed origins for API Gateway.

  CloudWatchNamespace:
    Type: String
    Default: CloudPulse
    Description: Custom CloudWatch metrics namespace for simulated resources.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Application logging verbosity.

  EnablePublicFrontendBucket:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Keep S3 private by default (false). Set to "true" only if directly serving
      the React SPA via S3 static website hosting for demonstration.

# ──────────────────────────────────────────────────────────────────────────────
# Conditions
# ──────────────────────────────────────────────────────────────────────────────
Conditions:
  CreateEmailSubscription: !Not [!Equals [!Ref NotificationEmail, ""]]
  IsPublicFrontendEnabled: !Equals [!Ref EnablePublicFrontendBucket, "true"]

# ──────────────────────────────────────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────────────────────────────────────
Resources:

  # ── Lambda Layer: Shared Core & Dependencies ──────────────────────────────
  CloudPulseLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub cloudpulse-shared-layer-${Environment}
      Description: Shared Python models, repositories, and dependencies for CloudPulse
      ContentUri: ../backend
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
        - x86_64
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  # ── DynamoDB: Resources Table ─────────────────────────────────────────────
  ResourcesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudpulse-resources-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: resource_id
          AttributeType: S
      KeySchema:
        - AttributeName: resource_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: CloudPulse

  # ── DynamoDB: Incidents Table ─────────────────────────────────────────────
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudpulse-incidents-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
        - AttributeName: resource_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ResourceIndex
          KeySchema:
            - AttributeName: resource_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: CloudPulse

  # ── SNS: Notifications Topic ──────────────────────────────────────────────
  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudpulse-notifications-${Environment}
      DisplayName: CloudPulse Reliability Alerts
      Tags:
        - Key: Project
          Value: CloudPulse

  NotificationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateEmailSubscription
    Properties:
      TopicArn: !Ref NotificationsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ── SQS: Recovery Dead Letter Queue ───────────────────────────────────────
  RecoveryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cloudpulse-recovery-dlq-${Environment}
      MessageRetentionPeriod: 86400
      Tags:
        - Key: Project
          Value: CloudPulse

  # ── API Gateway: HTTP API ─────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowedOrigins
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "protocol":"$context.protocol","responseLength":"$context.responseLength",
          "integrationLatency":"$context.integrationLatency"}

  # ── CloudWatch: Explicit Log Groups with Short Retention ──────────────────
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cloudpulse-api-${Environment}
      RetentionInDays: 7

  SimulatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cloudpulse-simulator-${Environment}
      RetentionInDays: 7

  RecoveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cloudpulse-recovery-${Environment}
      RetentionInDays: 7

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/cloudpulse-${Environment}
      RetentionInDays: 7

  # ── Lambda: API Function (FastAPI + Mangum) ───────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudpulse-api-${Environment}
      Description: FastAPI API Gateway handler for CloudPulse resources and simulation control
      CodeUri: ../lambda/api
      Handler: handler.handler
      Role: !GetAtt ApiFunctionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
      Events:
        ApiProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        ApiRootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ApiHealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  # ── Lambda: Simulator Function ────────────────────────────────────────────
  SimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudpulse-simulator-${Environment}
      Description: Scheduled virtual resource metric simulator and CloudWatch publisher
      CodeUri: ../lambda/simulator
      Handler: handler.handler
      Role: !GetAtt SimulatorFunctionRole.Arn
      Timeout: 60
      Events:
        SimulatorSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(2 minutes)
            Name: !Sub cloudpulse-heartbeat-${Environment}
            Description: Periodic simulator trigger
            Enabled: true

  # ── Lambda: Recovery Function ─────────────────────────────────────────────
  RecoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudpulse-recovery-${Environment}
      Description: Event-driven automated recovery handler for CloudPulse incidents
      CodeUri: ../lambda/recovery
      Handler: handler.handler
      Role: !GetAtt RecoveryFunctionRole.Arn
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt RecoveryDLQ.Arn
      Events:
        AlarmStateChange:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source:
                - aws.cloudwatch
              detail-type:
                - CloudWatch Alarm State Change
              detail:
                alarmName:
                  - prefix: cloudpulse-
                state:
                  value:
                    - ALARM
        DirectSimulatorEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source:
                - cloudpulse.simulator
              detail-type:
                - FailureInjected

  # ── CloudWatch Alarms: Failure Detection ──────────────────────────────────
  AlarmVM001HighCPU:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudpulse-VM-001-HIGH_CPU
      AlarmDescription: VM-001 CPU utilization exceeds 85 percent threshold
      Namespace: !Ref CloudWatchNamespace
      MetricName: CPUUtilization
      Dimensions:
        - Name: ResourceId
          Value: VM-001
        - Name: ResourceType
          Value: VM
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 85.0
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true

  AlarmVM001NetworkLatency:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudpulse-VM-001-NETWORK_LATENCY
      AlarmDescription: VM-001 network latency exceeds 500ms threshold
      Namespace: !Ref CloudWatchNamespace
      MetricName: NetworkLatency
      Dimensions:
        - Name: ResourceId
          Value: VM-001
        - Name: ResourceType
          Value: VM
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 500.0
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true

  AlarmAPI001ServiceFailure:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudpulse-API-001-SERVICE_FAILURE
      AlarmDescription: API-001 latency exceeds 500ms representing service failure
      Namespace: !Ref CloudWatchNamespace
      MetricName: NetworkLatency
      Dimensions:
        - Name: ResourceId
          Value: API-001
        - Name: ResourceType
          Value: API
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 500.0
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true

  AlarmDB001HighCPU:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudpulse-DB-001-HIGH_CPU
      AlarmDescription: DB-001 CPU utilization exceeds 85 percent threshold
      Namespace: !Ref CloudWatchNamespace
      MetricName: CPUUtilization
      Dimensions:
        - Name: ResourceId
          Value: DB-001
        - Name: ResourceType
          Value: DB
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 85.0
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true

  AlarmSTORAGE001StorageExhaustion:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudpulse-STORAGE-001-STORAGE_EXHAUSTION
      AlarmDescription: STORAGE-001 storage utilization exceeds 90 percent threshold
      Namespace: !Ref CloudWatchNamespace
      MetricName: StorageUtilization
      Dimensions:
        - Name: ResourceId
          Value: STORAGE-001
        - Name: ResourceType
          Value: STORAGE
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 90.0
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true

  # ── S3: Static Frontend Storage (Private by default) ──────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cloudpulse-frontend-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: !If [IsPublicFrontendEnabled, false, true]
        BlockPublicPolicy: !If [IsPublicFrontendEnabled, false, true]
        IgnorePublicAcls: !If [IsPublicFrontendEnabled, false, true]
        RestrictPublicBuckets: !If [IsPublicFrontendEnabled, false, true]
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: Project
          Value: CloudPulse

  # Public Bucket Policy attached ONLY if EnablePublicFrontendBucket is "true"
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsPublicFrontendEnabled
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*

  # ──────────────────────────────────────────────────────────────────────────
  # IAM Roles (Least-Privilege)
  # ──────────────────────────────────────────────────────────────────────────

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudpulse-api-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ResourcesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt IncidentsTable.Arn
                  - !Sub ${IncidentsTable.Arn}/index/*
        - PolicyName: ApiCloudWatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Ref CloudWatchNamespace
        - PolicyName: ApiEventBridgePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  SimulatorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudpulse-simulator-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SimulatorDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ResourcesTable.Arn
        - PolicyName: SimulatorCloudWatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Ref CloudWatchNamespace

  RecoveryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudpulse-recovery-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RecoveryDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ResourcesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: RecoverySNSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref NotificationsTopic
        - PolicyName: RecoverySQSDLQPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt RecoveryDLQ.Arn

# ──────────────────────────────────────────────────────────────────────────────
# Outputs
# ──────────────────────────────────────────────────────────────────────────────
Outputs:
  ApiEndpoint:
    Description: API Gateway base endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint

  FrontendBucketName:
    Description: S3 bucket name for frontend assets
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${AWS::StackName}-FrontendBucket

  FrontendBucketWebsiteURL:
    Description: S3 static website hosting endpoint
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub ${AWS::StackName}-FrontendWebsiteURL

  ResourcesTableName:
    Description: DynamoDB virtual resources table name
    Value: !Ref ResourcesTable
    Export:
      Name: !Sub ${AWS::StackName}-ResourcesTable

  IncidentsTableName:
    Description: DynamoDB incidents table name
    Value: !Ref IncidentsTable
    Export:
      Name: !Sub ${AWS::StackName}-IncidentsTable

  NotificationsTopicArn:
    Description: SNS notifications topic ARN
    Value: !Ref NotificationsTopic
    Export:
      Name: !Sub ${AWS::StackName}-NotificationsTopic

  RecoveryDLQArn:
    Description: SQS dead-letter queue ARN for recovery failures
    Value: !GetAtt RecoveryDLQ.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RecoveryDLQ
